name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - posts-updated
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update posts submodule
        run: |
          git -C src/posts fetch origin master
          git -C src/posts checkout --detach origin/master
          git add src/posts
          if git diff --cached --quiet -- src/posts; then
            echo "Posts submodule is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update posts submodule"
            git push origin master
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify posts submodule
        run: |
          test -d src/posts
          test -n "$(find src/posts -type f -name '*.md' -print -quit)"

      - name: Build VuePress site
        run: corepack pnpm run docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
